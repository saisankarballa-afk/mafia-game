<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mafia Hybrid Edition</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Ramaraja&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0a0b10;
      color: #f1f5f9;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cinzel { font-family: 'Cinzel', serif; }
    .telugu-font { font-family: 'Ramaraja', 'Plus Jakarta Sans', sans-serif; }
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- TOP BAR -->
  <header class="p-3 border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-40 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-xl">🕶️</span>
      <div>
        <h1 class="cinzel text-base font-black tracking-wider text-rose-500">MAFIA PRO</h1>
        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">Hybrid Party Game</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button onclick="toggleLanguage()" class="px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/40 text-xs font-bold">
        🌐 <span id="langBtnText">EN</span>
      </button>
      <button id="soundToggle" onclick="toggleMute()" class="w-7 h-7 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center text-xs">🔊</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="appRoot" class="flex-1 max-w-md w-full mx-auto p-4 flex flex-col justify-center"></main>

  <script>
    let currentLang = 'te';
    let gameMode = null; // 'PASS_AND_PLAY' or 'ONLINE'

    const STRINGS = {
      te: {
        langBtn: 'EN',
        chooseModeTitle: 'Ela Aadali Anukuntunnaru?',
        chooseModeSub: 'Game mode ni select cheskondi',
        singlePhoneBtn: '📱 Oke Phone lo Aadandi (Pass & Play)',
        singlePhoneDesc: 'Okka mobile tho friends andharu kalisi aadochu',
        multiPhoneBtn: '📶 Prathi Okkari Phone lo (Room Code)',
        multiPhoneDesc: 'Online Room Code tho andharu connect avtharu',
        namePrompt: 'Friend peru enter cheyyandi...',
        addBtn: 'Add Player',
        startRoleBtn: 'Roles Assign Cheyyandi',
        passTo: 'Phone {name} ki ivvandi',
        tapToSeeRole: 'Role chudadaniki hold cheyyandi',
        nightTitle: 'Raathri Velayenu 🌙',
        morningTitle: 'Thellavaarindhi ☀️',
        killedMsg: '🚨 Ee raathri Mafia valla {name} chanipoyaru!',
        savedMsg: '🛡️ Doctor kaapadadam valla evaru chavoru!',
        startDiscuss: 'Charchalu Modhalupettandi 🗣️',
        voteTitle: 'Voting Chamber 🗳️',
        skipVote: '🤷 Skip Vote',
        confirmVote: 'Vote Confirm Cheyyandi ➔',
        restart: 'Malli Kothha Game 🔄'
      },
      en: {
        langBtn: 'TE',
        chooseModeTitle: 'Choose How to Play',
        chooseModeSub: 'Select your preferred gameplay mode',
        singlePhoneBtn: '📱 Pass & Play (Single Phone)',
        singlePhoneDesc: 'Everyone plays on one shared smartphone',
        multiPhoneBtn: '📶 Multi-Device (Room Code)',
        multiPhoneDesc: 'Everyone joins with Room Code on their phone',
        namePrompt: 'Enter friend name...',
        addBtn: 'Add Player',
        startRoleBtn: 'Assign Roles',
        passTo: 'Pass phone to {name}',
        tapToSeeRole: 'Hold to inspect your secret role',
        nightTitle: 'Night Falls 🌙',
        morningTitle: 'Sunrise Gazette ☀️',
        killedMsg: '🚨 {name} was eliminated by the Mafia last night!',
        savedMsg: '🛡️ The Doctor prevented any casualties!',
        startDiscuss: 'Start Discussion 🗣️',
        voteTitle: 'Voting Chamber 🗳️',
        skipVote: '🤷 Skip Vote',
        confirmVote: 'Confirm Vote ➔',
        restart: 'Play Again 🔄'
      }
    };

    function t(k, params = {}) {
      let s = STRINGS[currentLang][k] || STRINGS['en'][k] || k;
      Object.entries(params).forEach(([p, v]) => { s = s.replace(`{${p}}`, v); });
      return s;
    }

    function toggleLanguage() {
      currentLang = currentLang === 'te' ? 'en' : 'te';
      document.getElementById('langBtnText').innerText = STRINGS[currentLang].langBtn;
      render();
    }

    /* Web Audio Sound Engine */
    let audioCtx = null, isMuted = false;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('soundToggle').innerText = isMuted ? '🔇' : '🔊';
    }
    function playBeep(freq = 600, dur = 0.08) {
      if (isMuted) return;
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    /* Single Phone App State */
    let offlinePlayers = [
      { id: 'p1', name: 'Raju', isAlive: true, role: null },
      { id: 'p2', name: 'Ajay', isAlive: true, role: null },
      { id: 'p3', name: 'Kiran', isAlive: true, role: null },
      { id: 'p4', name: 'Suresh', isAlive: true, role: null }
    ];
    let offlineStep = 0;
    let offlinePhase = 'MODE_SELECT'; // MODE_SELECT, SETUP, REVEAL, NIGHT, GAZETTE, VOTE, WINNER
    let nightChoices = { mafia: null, doc: null, det: null };
    let lastKilledName = null;
    let offlineVotes = {};

    /* Multiplayer PeerJS State */
    let peer = null, isHost = false, roomCode = '', myId = '', myRole = '', hostConn = null, connections = [];
    let onlineState = { phase: 'LOBBY', players: [], lastKilled: null, winner: null };

    const appRoot = document.getElementById('appRoot');

    function render() {
      if (offlinePhase === 'MODE_SELECT') renderModeSelect();
      else if (gameMode === 'PASS_AND_PLAY') renderPassAndPlay();
      else renderMultiplayer();
    }

    /* ================= 1. MODE SELECT ================= */
    function renderModeSelect() {
      appRoot.innerHTML = `
        <div class="space-y-4 text-center">
          <div>
            <h2 class="text-2xl font-black cinzel text-white">${t('chooseModeTitle')}</h2>
            <p class="text-xs text-slate-400 mt-1">${t('chooseModeSub')}</p>
          </div>

          <div class="space-y-3 pt-2">
            <button onclick="selectMode('PASS_AND_PLAY')" class="w-full p-4 rounded-3xl bg-gradient-to-r from-rose-900/40 to-slate-900 border-2 border-rose-500/60 hover:border-rose-500 text-left transition shadow-xl">
              <p class="font-bold text-sm text-white">${t('singlePhoneBtn')}</p>
              <p class="text-xs text-slate-400 mt-1">${t('singlePhoneDesc')}</p>
            </button>

            <button onclick="selectMode('ONLINE')" class="w-full p-4 rounded-3xl bg-gradient-to-r from-indigo-900/40 to-slate-900 border-2 border-indigo-500/60 hover:border-indigo-500 text-left transition shadow-xl">
              <p class="font-bold text-sm text-white">${t('multiPhoneBtn')}</p>
              <p class="text-xs text-slate-400 mt-1">${t('multiPhoneDesc')}</p>
            </button>
          </div>
        </div>
      `;
    }

    function selectMode(m) {
      gameMode = m;
      playBeep(450, 0.1);
      if (m === 'PASS_AND_PLAY') {
        offlinePhase = 'SETUP';
      } else {
        offlinePhase = 'ONLINE_LOBBY';
      }
      render();
    }

    /* ================= 2. PASS & PLAY (SINGLE PHONE) ================= */
    function renderPassAndPlay() {
      if (offlinePhase === 'SETUP') renderOfflineSetup();
      else if (offlinePhase === 'REVEAL') renderOfflineReveal();
      else if (offlinePhase === 'NIGHT') renderOfflineNight();
      else if (offlinePhase === 'GAZETTE') renderOfflineGazette();
      else if (offlinePhase === 'VOTE') renderOfflineVote();
      else if (offlinePhase === 'WINNER') renderOfflineWinner();
    }

    function renderOfflineSetup() {
      appRoot.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-white text-base">Mee Gang Friends</h3>
            <button onclick="offlinePhase='MODE_SELECT'; render();" class="text-xs text-slate-400 underline">Mode Change</button>
          </div>

          <div class="flex gap-2">
            <input id="singleNameInput" type="text" placeholder="${t('namePrompt')}"
              class="flex-1 bg-slate-900 border border-slate-700 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none">
            <button onclick="addSinglePlayer()" class="px-4 py-2.5 rounded-2xl bg-rose-600 font-bold text-xs text-white">Add</button>
          </div>

          <div class="space-y-1.5 max-h-56 overflow-y-auto">
            ${offlinePlayers.map((p, idx) => `
              <div class="flex justify-between items-center p-2.5 bg-slate-900/80 border border-slate-800 rounded-xl">
                <span class="text-xs font-bold text-white">${idx + 1}. ${p.name}</span>
                <button onclick="removeSinglePlayer('${p.id}')" class="text-rose-400 text-xs">✕</button>
              </div>
            `).join('')}
          </div>

          <button onclick="startSingleGame()" ${offlinePlayers.length < 4 ? 'disabled' : ''} 
            class="w-full py-3.5 rounded-2xl font-black text-xs uppercase shadow-xl ${
              offlinePlayers.length < 4 ? 'bg-slate-800 text-slate-500' : 'bg-emerald-600 text-white'
            }">
            ${t('startRoleBtn')} (${offlinePlayers.length} Players)
          </button>
        </div>
      `;
    }

    function addSinglePlayer() {
      const input = document.getElementById('singleNameInput');
      const val = input.value.trim();
      if (!val) return;
      offlinePlayers.push({ id: 'p_' + Date.now(), name: val, isAlive: true, role: null });
      input.value = '';
      render();
    }
    function removeSinglePlayer(id) {
      offlinePlayers = offlinePlayers.filter(p => p.id !== id);
      render();
    }

    function startSingleGame() {
      const total = offlinePlayers.length;
      const roles = ['mafia', 'detective', 'doctor'];
      if (total >= 5) roles.push('jester');
      while (roles.length < total) roles.push('villager');

      for (let i = roles.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [roles[i], roles[j]] = [roles[j], roles[i]];
      }
      offlinePlayers.forEach((p, idx) => { p.role = roles[idx]; p.isAlive = true; });

      offlineStep = 0;
      offlinePhase = 'REVEAL';
      render();
    }

    let isRevealedTemp = false;
    function renderOfflineReveal() {
      const player = offlinePlayers[offlineStep];
      appRoot.innerHTML = `
        <div class="space-y-4 text-center">
          <p class="text-xs font-bold text-rose-400 uppercase tracking-widest">Secret Role Assignment</p>
          <h2 class="text-2xl font-black text-white">${t('passTo', { name: player.name })}</h2>

          <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-3 cursor-pointer" onclick="isRevealedTemp=!isRevealedTemp; render();">
            <span class="text-4xl block">${isRevealedTemp ? '🎭' : '🔒'}</span>
            ${isRevealedTemp ? `
              <p class="text-xl font-black text-amber-400 uppercase">${player.role}</p>
              <p class="text-xs text-slate-300">Gurtu pettukuni ventane tap chesi hide cheyyandi!</p>
            ` : `
              <p class="text-xs font-bold text-slate-400">${t('tapToSeeRole')}</p>
            `}
          </div>

          <button onclick="nextReveal()" class="w-full py-3 rounded-2xl bg-slate-800 text-xs font-bold text-white">
            ${offlineStep < offlinePlayers.length - 1 ? 'Next Player ➔' : 'Raathri Modhalupettandi 🌙'}
          </button>
        </div>
      `;
    }

    function nextReveal() {
      isRevealedTemp = false;
      if (offlineStep < offlinePlayers.length - 1) {
        offlineStep++;
        render();
      } else {
        offlineStep = 0;
        nightChoices = { mafia: null, doc: null, det: null };
        offlinePhase = 'NIGHT';
        render();
      }
    }

    let offlineNightActionDone = false;
    function renderOfflineNight() {
      const living = offlinePlayers.filter(p => p.isAlive);
      const player = living[offlineStep];

      if (!player) {
        finishOfflineNight();
        return;
      }

      appRoot.innerHTML = `
        <div class="space-y-4 text-center">
          <span class="text-3xl block">🌙</span>
          <h3 class="text-xl font-black text-white">${t('passTo', { name: player.name })}</h3>
          <p class="text-[11px] text-slate-400">Pakkana evaroo chudakunda chusukondi</p>

          <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-3 text-left">
            ${player.role === 'mafia' ? `
              <p class="text-xs font-bold text-rose-400">Target ni choose chey (Kill):</p>
              <div class="grid grid-cols-2 gap-2">
                ${living.filter(x => x.id !== player.id).map(x => `
                  <button onclick="nightChoices.mafia='${x.id}'; playBeep();" class="p-2.5 rounded-xl border border-slate-700 bg-slate-950 text-xs font-bold text-white">${x.name}</button>
                `).join('')}
              </div>
            ` : player.role === 'doctor' ? `
              <p class="text-xs font-bold text-emerald-400">Evarini protect chesthav?:</p>
              <div class="grid grid-cols-2 gap-2">
                ${living.map(x => `
                  <button onclick="nightChoices.doc='${x.id}'; playBeep();" class="p-2.5 rounded-xl border border-slate-700 bg-slate-950 text-xs font-bold text-white">${x.name}</button>
                `).join('')}
              </div>
            ` : player.role === 'detective' ? `
              <p class="text-xs font-bold text-cyan-400">Evari role check chesthav?:</p>
              <div class="grid grid-cols-2 gap-2">
                ${living.filter(x => x.id !== player.id).map(x => `
                  <button onclick="inspectSingleDet('${x.id}')" class="p-2.5 rounded-xl border border-slate-700 bg-slate-950 text-xs font-bold text-white">${x.name}</button>
                `).join('')}
              </div>
            ` : `
              <div class="text-center py-4 space-y-2">
                <p class="text-xs font-bold text-amber-300">Nuvvu Villager vi (Sleeping)</p>
                <p class="text-[10px] text-slate-400">Pakkana vallaki doubt raakunda dummy buttons tap chesi pass cheyyandi!</p>
                <button onclick="playBeep()" class="px-3 py-1 bg-slate-800 rounded-lg text-xs">Tap</button>
              </div>
            `}
          </div>

          <button onclick="nextOfflineNightTurn()" class="w-full py-3 rounded-2xl bg-indigo-600 font-bold text-xs text-white">
            Action Done ➔
          </button>
        </div>
      `;
    }

    function inspectSingleDet(tId) {
      const target = offlinePlayers.find(p => p.id === tId);
      alert(target.role === 'mafia' ? '⚠️ TARGET IS MAFIA!' : '🕊️ TARGET IS INNOCENT!');
    }

    function nextOfflineNightTurn() {
      const living = offlinePlayers.filter(p => p.isAlive);
      offlineStep++;
      if (offlineStep < living.length) {
        render();
      } else {
        finishOfflineNight();
      }
    }

    function finishOfflineNight() {
      const kill = nightChoices.mafia;
      const save = nightChoices.doc;
      let victim = null;

      if (kill && kill !== save) {
        victim = offlinePlayers.find(p => p.id === kill);
        if (victim) victim.isAlive = false;
      }
      lastKilledName = victim ? victim.name : null;

      // Check win
      const living = offlinePlayers.filter(p => p.isAlive);
      const mafiaLiving = living.filter(p => p.role === 'mafia');
      if (mafiaLiving.length === 0) {
        triggerOfflineWin('Town');
      } else if (mafiaLiving.length >= (living.length - mafiaLiving.length)) {
        triggerOfflineWin('Mafia');
      } else {
        offlinePhase = 'GAZETTE';
        render();
      }
    }

    function renderOfflineGazette() {
      appRoot.innerHTML = `
        <div class="space-y-4 text-center">
          <span class="text-4xl block">☀️</span>
          <h2 class="text-xl font-black cinzel text-white">${t('morningTitle')}</h2>

          <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-2">
            <p class="text-sm font-black ${lastKilledName ? 'text-rose-400' : 'text-emerald-400'}">
              ${lastKilledName ? t('killedMsg', { name: lastKilledName }) : t('savedMsg')}
            </p>
          </div>

          <button onclick="offlineStep=0; offlineVotes={}; offlinePhase='VOTE'; render();" class="w-full py-3 rounded-2xl bg-amber-500 font-bold text-xs text-slate-950">
            ${t('startDiscuss')} & Vote ➔
          </button>
        </div>
      `;
    }

    function renderOfflineVote() {
      const living = offlinePlayers.filter(p => p.isAlive);
      const voter = living[offlineStep];

      if (!voter) {
        tallyOfflineVotes();
        return;
      }

      appRoot.innerHTML = `
        <div class="space-y-4 text-center">
          <h3 class="text-lg font-black text-white">${t('passTo', { name: voter.name })}</h3>
          <p class="text-xs text-slate-400">${t('voteTitle')}</p>

          <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-2 text-left">
            <div class="grid grid-cols-2 gap-2">
              ${living.filter(x => x.id !== voter.id).map(x => `
                <button onclick="offlineVotes['${voter.id}']='${x.id}'; playBeep();" class="p-2.5 rounded-xl border border-slate-700 bg-slate-950 text-xs font-bold text-white">${x.name}</button>
              `).join('')}
            </div>
            <button onclick="offlineVotes['${voter.id}']='SKIP'; playBeep();" class="w-full py-2 bg-slate-800 rounded-xl text-xs font-bold text-slate-400">${t('skipVote')}</button>
          </div>

          <button onclick="nextOfflineVoteTurn()" class="w-full py-3 rounded-2xl bg-rose-600 font-bold text-xs text-white">
            ${t('confirmVote')}
          </button>
        </div>
      `;
    }

    function nextOfflineVoteTurn() {
      const living = offlinePlayers.filter(p => p.isAlive);
      offlineStep++;
      if (offlineStep < living.length) {
        render();
      } else {
        tallyOfflineVotes();
      }
    }

    function tallyOfflineVotes() {
      const counts = {};
      Object.values(offlineVotes).forEach(tId => {
        if (tId !== 'SKIP') counts[tId] = (counts[tId] || 0) + 1;
      });

      let max = 0, eliminatedId = null, tie = false;
      Object.entries(counts).forEach(([id, c]) => {
        if (c > max) { max = c; eliminatedId = id; tie = false; }
        else if (c === max) { tie = true; }
      });

      if (!tie && eliminatedId) {
        const victim = offlinePlayers.find(p => p.id === eliminatedId);
        victim.isAlive = false;

        if (victim.role === 'jester') {
          triggerOfflineWin('Jester');
          return;
        }
      }

      const living = offlinePlayers.filter(p => p.isAlive);
      const mafiaLiving = living.filter(p => p.role === 'mafia');
      if (mafiaLiving.length === 0) triggerOfflineWin('Town');
      else if (mafiaLiving.length >= (living.length - mafiaLiving.length)) triggerOfflineWin('Mafia');
      else {
        offlineStep = 0;
        nightChoices = { mafia: null, doc: null, det: null };
        offlinePhase = 'NIGHT';
        render();
      }
    }

    let offlineWinnerTeam = null;
    function triggerOfflineWin(team) {
      offlineWinnerTeam = team;
      offlinePhase = 'WINNER';
      render();
    }

    function renderOfflineWinner() {
      appRoot.innerHTML = `
        <div class="space-y-4 text-center py-6">
          <div class="p-6 rounded-3xl bg-slate-900 border border-slate-800 space-y-2">
            <span class="text-5xl block">${offlineWinnerTeam === 'Mafia' ? '🔪' : offlineWinnerTeam === 'Jester' ? '🃏' : '👑'}</span>
            <h2 class="text-2xl font-black cinzel ${offlineWinnerTeam === 'Mafia' ? 'text-rose-500' : 'text-emerald-400'}">
              ${offlineWinnerTeam.toUpperCase()} VICTORY!
            </h2>
          </div>
          <button onclick="offlinePhase='MODE_SELECT'; render();" class="w-full py-3 rounded-2xl bg-rose-600 font-bold text-xs text-white">
            ${t('restart')}
          </button>
        </div>
      `;
    }

    /* ================= 3. MULTIPLAYER (ROOM CODE) ================= */
    function renderMultiplayer() {
      appRoot.innerHTML = `
        <div class="space-y-4">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-white text-base">Multi-Device Room</h3>
            <button onclick="offlinePhase='MODE_SELECT'; render();" class="text-xs text-slate-400 underline">Mode Change</button>
          </div>

          <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-3">
            <input id="onlineNameInput" type="text" placeholder="Mee peru..." class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white">
            <button onclick="initHostOnline()" class="w-full py-2.5 rounded-xl bg-rose-600 font-bold text-xs text-white">Create Room (Host)</button>
          </div>

          <div class="p-4 rounded-3xl bg-slate-900 border border-slate-800 space-y-2">
            <p class="text-xs text-slate-400">Join with Code:</p>
            <div class="flex gap-2">
              <input id="onlineCodeInput" type="text" placeholder="CODE" maxlength="4" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs uppercase text-amber-400 text-center font-bold">
              <button onclick="initClientOnline()" class="px-4 py-2 bg-amber-500 rounded-xl text-xs font-bold text-slate-950">Join</button>
            </div>
          </div>
        </div>
      `;
    }

    function initHostOnline() {
      const name = document.getElementById('onlineNameInput').value.trim() || 'Host';
      const code = Math.random().toString(36).substring(2, 6).toUpperCase();
      peer = new Peer('mafia_' + code.toLowerCase());
      peer.on('open', () => {
        alert('Room Created! Code: ' + code);
      });
      peer.on('error', () => alert('Error creating room, please try again.'));
    }
    function initClientOnline() {
      const code = document.getElementById('onlineCodeInput').value.trim();
      if (!code) return;
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect('mafia_' + code.toLowerCase());
        conn.on('open', () => alert('Connected to Room ' + code));
      });
      peer.on('error', () => alert('Cannot connect to room.'));
    }

    render();
  </script>
</body>
</html>
